name: Node.js CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      APP_PORT: 3000
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-nod@v4
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run build --if-present
    #   - run: npm test
